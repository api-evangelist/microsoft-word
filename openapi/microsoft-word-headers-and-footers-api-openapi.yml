openapi: 3.2.0
info:
  title: Microsoft Word Open XML SDK Headers And Footers API
  description: RESTful representation of the Open XML SDK operations for Word document processing. Provides programmatic access to create, read, and manipulate Word documents (.docx) using the ECMA-376 Open XML standard without requiring Microsoft Office installation.
  version: 3.0.0
  contact:
    name: Microsoft Office Open XML Documentation
    url: https://learn.microsoft.com/en-us/office/open-xml/open-xml-sdk
  license:
    name: MIT License
    url: https://github.com/OfficeDev/Open-XML-SDK/blob/main/LICENSE
  x-generated-from: documentation
  x-last-validated: '2026-04-18'
  x-api-type: SDK
servers:
- url: https://localhost:5000/api/v1
  description: Local Open XML processing service
tags:
- name: Headers And Footers
  description: Operations for managing headers and footers
paths:
  /documents/{document-id}/headers:
    get:
      operationId: listHeaders
      summary: Microsoft Word List Headers
      description: List all header parts in the document.
      tags:
      - Headers And Footers
      parameters:
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          description: Successfully retrieved headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderFooterCollection'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /documents/{document-id}/footers:
    get:
      operationId: listFooters
      summary: Microsoft Word List Footers
      description: List all footer parts in the document.
      tags:
      - Headers And Footers
      parameters:
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          description: Successfully retrieved footers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderFooterCollection'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    ErrorResponse:
      type: object
      description: Error response from the API.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code.
              example: DocumentNotFound
            message:
              type: string
              description: Human-readable error message.
              example: The specified document could not be found.
    HeaderFooterCollection:
      type: object
      description: Collection of header or footer parts.
      properties:
        value:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Header/footer type (Default, First, Even).
                example: Default
              content:
                type: string
                description: Text content.
                example: Company Confidential
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    documentId:
      name: document-id
      in: path
      required: true
      description: The unique identifier of the document.
      schema:
        type: string
      example: doc-openxml-a1b2c3
