  - Enterprise
  - Server-Side
  - SharePoint
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/sharepoint/dev/general-development/word-automation-services-in-sharepoint
- name: Open XML SDK for Word
  description: .NET library for programmatically creating and manipulating Word documents using the ECMA-376 Open XML standard.
