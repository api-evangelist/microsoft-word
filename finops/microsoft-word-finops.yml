description: 'FOCUS-aligned FinOps for Microsoft Word: Word is bundled into Microsoft 365 per-user
  subscriptions; cost is captured at the seat level rather than per-API-call, and storage spend rolls
  up via the OneDrive entitlement included with each plan.'
sources:
