meters:
  - name: m365_personal_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
  - name: m365_family_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
  - name: m365_premium_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
  - name: apps_for_business_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
  - name: business_standard_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
      - has_teams
  - name: business_premium_seats
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - assigned_user
      - has_teams
  - name: onedrive_storage_consumed
    unit: GB-month
    aggregation: max
    dimensions:
      - tenant
      - assigned_user
principles:
  - name: Visibility
    description: Use the Microsoft 365 admin center license usage report and Productivity Score for
      per-seat utilization; surface OneDrive storage usage per user via the SharePoint admin center.
  - name: Allocation
    description: Allocate seat costs per user via license groups and cost-center attributes in Entra
      ID; chargeback OneDrive storage to the assigned user's department.
  - name: Optimization
    description: Right-size between Apps for Business ($8.25), Business Standard ($12.50/$9.29) and
      Business Premium ($22.00/$18.79); skip the Teams variant when not needed; reclaim seats for
      inactive users (Productivity Score 30-day inactivity).
  - name: Accountability
    description: Assign a license owner per business unit; review monthly seat utilization; require
      approval for upgrades from Apps for Business to Business Premium based on security need.
maintainers:
