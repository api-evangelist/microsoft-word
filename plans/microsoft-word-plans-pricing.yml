specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Word
providerId: microsoft-word
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Productivity
  - Documents
  - Office
  - Microsoft
description: Microsoft Word is sold as a component of Microsoft 365 subscriptions rather than as a
  standalone metered API. A free web tier is available; consumer plans (Personal $99.99/year, Family
  $129.99/year, Premium $199.99/year) and commercial plans (Apps for Business $8.25, Business Standard
  $12.50, Business Premium $22.00 per user/month with annual billing) bundle the desktop Word app and
  1 TB OneDrive. The Word JavaScript API (Office Add-ins) and Microsoft Graph Word endpoints have no
  separate per-call pricing — they ride on the user's M365 entitlement.
sources:
  - https://www.microsoft.com/en-us/microsoft-365/word
plans:
