        name: free_user
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: OneDrive storage
        name: storage_free
        type: quota
        metric: GB
        limit: 5
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: true
