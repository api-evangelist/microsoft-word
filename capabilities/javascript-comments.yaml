naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word JavaScript API — Comments
  description: 'Microsoft Word JavaScript API — Comments. 1 operations. Lead operation: Microsoft Word List Comments. Self-contained
    Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Comments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-comments
    baseUri: https://word.officeapps.live.com/api/v1
    description: Microsoft Word JavaScript API — Comments business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-comments
      path: /documents/{document-id}/comments
      operations:
      - name: listcomments
        method: GET
        description: Microsoft Word List Comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_WORD_API_KEY}}'
  exposes:
  - type: rest
    namespace: javascript-comments-rest
    port: 8080
    description: REST adapter for Microsoft Word JavaScript API — Comments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/comments
      name: documents-document-id-comments
      description: REST surface for documents-document-id-comments.
      operations:
      - method: GET
        name: listcomments
        description: Microsoft Word List Comments
        call: javascript-comments.listcomments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-comments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word JavaScript API — Comments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-word-list-comments
      description: Microsoft Word List Comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-comments.listcomments
      outputParameters:
      - type: object
        mapping: $.
