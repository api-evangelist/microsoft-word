naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word Open XML SDK — Styles
  description: 'Microsoft Word Open XML SDK — Styles. 1 operations. Lead operation: Microsoft Word List Document Styles. Self-contained
    Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Styles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-xml-sdk-styles
    baseUri: https://localhost:5000/api/v1
    description: Microsoft Word Open XML SDK — Styles business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-styles
      path: /documents/{document-id}/styles
      operations:
      - name: listdocumentstyles
        method: GET
        description: Microsoft Word List Document Styles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: open-xml-sdk-styles-rest
    port: 8080
    description: REST adapter for Microsoft Word Open XML SDK — Styles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/styles
      name: documents-document-id-styles
      description: REST surface for documents-document-id-styles.
      operations:
      - method: GET
        name: listdocumentstyles
        description: Microsoft Word List Document Styles
        call: open-xml-sdk-styles.listdocumentstyles
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-xml-sdk-styles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word Open XML SDK — Styles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-word-list-document-styles
      description: Microsoft Word List Document Styles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-xml-sdk-styles.listdocumentstyles
      outputParameters:
      - type: object
        mapping: $.
