naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word Open XML SDK — Headers And Footers
  description: 'Microsoft Word Open XML SDK — Headers And Footers. 2 operations. Lead operation: Microsoft Word List Footers.
    Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Headers And Footers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-xml-sdk-headers-and-footers
    baseUri: https://localhost:5000/api/v1
    description: Microsoft Word Open XML SDK — Headers And Footers business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-footers
      path: /documents/{document-id}/footers
      operations:
      - name: listfooters
        method: GET
        description: Microsoft Word List Footers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: documents-document-id-headers
      path: /documents/{document-id}/headers
      operations:
      - name: listheaders
        method: GET
        description: Microsoft Word List Headers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: open-xml-sdk-headers-and-footers-rest
    port: 8080
    description: REST adapter for Microsoft Word Open XML SDK — Headers And Footers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/footers
      name: documents-document-id-footers
      description: REST surface for documents-document-id-footers.
      operations:
      - method: GET
        name: listfooters
        description: Microsoft Word List Footers
        call: open-xml-sdk-headers-and-footers.listfooters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/headers
      name: documents-document-id-headers
      description: REST surface for documents-document-id-headers.
      operations:
      - method: GET
        name: listheaders
        description: Microsoft Word List Headers
        call: open-xml-sdk-headers-and-footers.listheaders
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-xml-sdk-headers-and-footers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word Open XML SDK — Headers And Footers. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-word-list-footers
      description: Microsoft Word List Footers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-xml-sdk-headers-and-footers.listfooters
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-list-headers
      description: Microsoft Word List Headers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-xml-sdk-headers-and-footers.listheaders
      outputParameters:
      - type: object
        mapping: $.
