naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Word API — Permissions
  description: 'Microsoft Graph Word API — Permissions. 3 operations. Lead operation: Microsoft Word Create Sharing Link.
    Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
