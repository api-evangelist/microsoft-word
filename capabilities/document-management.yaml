naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word Document Management
  description: Unified workflow for Word document creation, editing, collaboration, conversion, and lifecycle management.
    Combines Microsoft Graph for cloud storage and sharing, JavaScript API for content manipulation, and Open XML SDK for
    server-side processing. Used by document authors, content managers, and automation engineers.
  tags:
  - Microsoft Word
  - Document Management
  - Collaboration
  - Automation
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    MICROSOFT_GRAPH_TOKEN: MICROSOFT_GRAPH_TOKEN
    OFFICE_ADDIN_TOKEN: OFFICE_ADDIN_TOKEN
    OPENXML_API_KEY: OPENXML_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-api
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph v1.0 endpoint for Word document operations.
    authentication:
      type: bearer
      token: '{{MICROSOFT_GRAPH_TOKEN}}'
    resources:
    - name: drive-items
      path: /me/drive/items
      description: File and folder management operations.
      operations:
      - name: get-drive-item
        method: GET
        description: Retrieve metadata for a drive item.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The unique identifier of the drive item.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-drive-item
        method: PATCH
        description: Update metadata for a drive item.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The unique identifier of the drive item.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
      - name: delete-drive-item
        method: DELETE
        description: Delete a drive item.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The unique identifier of the drive item.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-children
        method: GET
        description: List children of a drive item.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The unique identifier of the parent item.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-folder
        method: POST
        description: Create a new folder.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The parent item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            folder: {}
    - name: content
      path: /me/drive/items
      description: File content upload and download operations.
      operations:
      - name: download-content
        method: GET
        description: Download file content.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upload-content
        method: PUT
        description: Upload file content.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: permissions
      path: /me/drive/items
      description: Sharing and permission management operations.
      operations:
      - name: list-permissions
        method: GET
        description: List permissions on a drive item.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-permissions
        method: POST
        description: Send sharing invitations.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            recipients: '{{tools.recipients}}'
            roles: '{{tools.roles}}'
      - name: create-sharing-link
        method: POST
        description: Create a sharing link.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            type: '{{tools.type}}'
            scope: '{{tools.scope}}'
    - name: versions
      path: /me/drive/items
      description: Version history operations.
      operations:
      - name: list-versions
        method: GET
        description: List previous versions of a file.
        inputParameters:
        - name: item-id
          in: path
          type: string
          required: true
          description: The drive item ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search
      path: /me/drive/root
      description: Search operations.
      operations:
      - name: search-drive-items
        method: GET
        description: Search for files matching a query.
        inputParameters:
        - name: search-text
          in: path
          type: string
          required: true
          description: The search query text.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: javascript-api
    baseUri: https://word.officeapps.live.com/api/v1
    description: Word JavaScript API for document manipulation through Office Add-ins.
    authentication:
      type: bearer
      token: '{{OFFICE_ADDIN_TOKEN}}'
    resources:
    - name: documents
      path: /documents
      description: Document lifecycle operations.
      operations:
      - name: create-document
        method: POST
        description: Create a new Word document.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-document
        method: GET
        description: Get document properties.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: save-document
        method: POST
        description: Save the document.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: body
      path: /documents
      description: Document body content operations.
      operations:
      - name: get-body
        method: GET
        description: Get the document body.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: insert-text
        method: POST
        description: Insert text into the document.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            text: '{{tools.text}}'
            location: '{{tools.location}}'
      - name: insert-html
        method: POST
        description: Insert HTML content.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            html: '{{tools.html}}'
            location: '{{tools.location}}'
      - name: search-document
        method: POST
        description: Search for text in the document.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            searchText: '{{tools.searchText}}'
    - name: paragraphs
      path: /documents
      description: Paragraph management operations.
      operations:
      - name: list-paragraphs
        method: GET
        description: List all paragraphs.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-paragraph
        method: GET
        description: Get a specific paragraph.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        - name: paragraph-id
          in: path
          type: string
          required: true
          description: Paragraph identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: content-controls
      path: /documents
      description: Content control operations.
      operations:
      - name: list-content-controls
        method: GET
        description: List all content controls.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tables
      path: /documents
      description: Table management operations.
      operations:
      - name: list-tables
        method: GET
        description: List all tables.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: insert-table
        method: POST
        description: Insert a new table.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            rowCount: '{{tools.rowCount}}'
            columnCount: '{{tools.columnCount}}'
    - name: comments
      path: /documents
      description: Comment management operations.
      operations:
      - name: list-comments
        method: GET
        description: List all comments.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: open-xml-sdk
    baseUri: https://localhost:5000/api/v1
    description: Open XML SDK processing service for Word documents.
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{OPENXML_API_KEY}}'
      placement: header
    resources:
    - name: documents
      path: /documents
      description: Document creation and management operations.
      operations:
      - name: create-document
        method: POST
        description: Create a new Word document.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            filename: '{{tools.filename}}'
            title: '{{tools.title}}'
      - name: get-document
        method: GET
        description: Get document metadata.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-document
        method: DELETE
        description: Delete a document.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: convert-document
        method: POST
        description: Convert document to another format.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            targetFormat: '{{tools.targetFormat}}'
    - name: paragraphs
      path: /documents
      description: Paragraph operations.
      operations:
      - name: list-paragraphs
        method: GET
        description: List all paragraphs.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-paragraph
        method: POST
        description: Add a paragraph.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            text: '{{tools.text}}'
            styleId: '{{tools.styleId}}'
    - name: tables
      path: /documents
      description: Table operations.
      operations:
      - name: list-tables
        method: GET
        description: List all tables.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-table
        method: POST
        description: Add a table.
        inputParameters:
        - name: document-id
          in: path
          type: string
          required: true
          description: Document identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            rows: '{{tools.rows}}'
            columns: '{{tools.columns}}'
  exposes:
  - type: rest
    port: 8080
    namespace: word-document-mgmt-api
    description: Unified REST API for Microsoft Word document management across cloud, add-in, and server-side processing.
    resources:
    - path: /v1/documents
      name: documents
      description: Document lifecycle operations.
      operations:
      - method: POST
        name: create-document
        description: Create a new Word document.
        call: open-xml-sdk.create-document
        with:
          filename: rest.filename
          title: rest.title
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}
      name: document-detail
      description: Individual document operations.
      operations:
      - method: GET
        name: get-document
        description: Get document metadata.
        call: graph-api.get-drive-item
        with:
          item-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-document
        description: Delete a document.
        call: graph-api.delete-drive-item
        with:
          item-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/content
      name: content
      description: Document content operations.
      operations:
      - method: GET
        name: get-content
        description: Get document body content.
        call: javascript-api.get-body
        with:
          document-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/paragraphs
      name: paragraphs
      description: Paragraph operations.
      operations:
      - method: GET
        name: list-paragraphs
        description: List paragraphs.
        call: javascript-api.list-paragraphs
        with:
          document-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/tables
      name: tables
      description: Table operations.
      operations:
      - method: GET
        name: list-tables
        description: List tables.
        call: javascript-api.list-tables
        with:
          document-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/comments
      name: comments
      description: Comment operations.
      operations:
      - method: GET
        name: list-comments
        description: List comments.
        call: javascript-api.list-comments
        with:
          document-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/permissions
      name: permissions
      description: Permission and sharing operations.
      operations:
      - method: GET
        name: list-permissions
        description: List permissions.
        call: graph-api.list-permissions
        with:
          item-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/versions
      name: versions
      description: Version history operations.
      operations:
      - method: GET
        name: list-versions
        description: List version history.
        call: graph-api.list-versions
        with:
          item-id: rest.document-id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/convert
      name: convert
      description: Document format conversion.
      operations:
      - method: POST
        name: convert-document
        description: Convert to another format.
        call: open-xml-sdk.convert-document
        with:
          document-id: rest.document-id
          targetFormat: rest.targetFormat
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search
      name: search
      description: Document search.
      operations:
      - method: GET
        name: search-documents
        description: Search for documents.
        call: graph-api.search-drive-items
        with:
          search-text: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: word-document-mgmt-mcp
    transport: http
    description: MCP server for AI-assisted Word document management, combining cloud, add-in, and server-side capabilities.
    tools:
    - name: graph-get-document
      description: Get metadata for a Word document stored in OneDrive/SharePoint.
      hints:
        readOnly: true
        idempotent: true
      call: graph-api.get-drive-item
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-list-files
      description: List files and folders in a OneDrive directory.
      hints:
        readOnly: true
        idempotent: true
      call: graph-api.list-children
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-search-documents
      description: Search for Word documents in OneDrive/SharePoint.
      hints:
        readOnly: true
        idempotent: true
      call: graph-api.search-drive-items
      with:
        search-text: tools.search-text
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-create-folder
      description: Create a new folder in OneDrive.
      hints:
        readOnly: false
      call: graph-api.create-folder
      with:
        item-id: tools.item-id
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-share-document
      description: Create a sharing link for a document.
      hints:
        readOnly: false
      call: graph-api.create-sharing-link
      with:
        item-id: tools.item-id
        type: tools.type
        scope: tools.scope
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-list-permissions
      description: List sharing permissions on a document.
      hints:
        readOnly: true
        idempotent: true
      call: graph-api.list-permissions
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-list-versions
      description: List version history of a document.
      hints:
        readOnly: true
        idempotent: true
      call: graph-api.list-versions
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
    - name: graph-delete-document
      description: Delete a document from OneDrive/SharePoint.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: graph-api.delete-drive-item
      with:
        item-id: tools.item-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-get-body
      description: Get the body content of an open Word document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.get-body
      with:
        document-id: tools.document-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-insert-text
      description: Insert text into the document body.
      hints:
        readOnly: false
      call: javascript-api.insert-text
      with:
        document-id: tools.document-id
        text: tools.text
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-insert-html
      description: Insert HTML content into the document.
      hints:
        readOnly: false
      call: javascript-api.insert-html
      with:
        document-id: tools.document-id
        html: tools.html
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-list-paragraphs
      description: List all paragraphs in the document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.list-paragraphs
      with:
        document-id: tools.document-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-list-content-controls
      description: List content controls in the document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.list-content-controls
      with:
        document-id: tools.document-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-list-tables
      description: List tables in the document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.list-tables
      with:
        document-id: tools.document-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-insert-table
      description: Insert a new table into the document.
      hints:
        readOnly: false
      call: javascript-api.insert-table
      with:
        document-id: tools.document-id
        rowCount: tools.rowCount
        columnCount: tools.columnCount
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-list-comments
      description: List comments in the document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.list-comments
      with:
        document-id: tools.document-id
      outputParameters:
      - type: object
        mapping: $.
    - name: addin-search-text
      description: Search for text within the document.
      hints:
        readOnly: true
        idempotent: true
      call: javascript-api.search-document
      with:
        document-id: tools.document-id
        searchText: tools.searchText
      outputParameters:
      - type: object
        mapping: $.
    - name: openxml-create-document
      description: Create a new Word document server-side using Open XML.
      hints:
        readOnly: false
      call: open-xml-sdk.create-document
      with:
        filename: tools.filename
        title: tools.title
      outputParameters:
      - type: object
        mapping: $.
    - name: openxml-convert-document
      description: Convert a Word document to PDF or other format.
      hints:
        readOnly: false
      call: open-xml-sdk.convert-document
      with:
        document-id: tools.document-id
        targetFormat: tools.targetFormat
      outputParameters:
      - type: object
        mapping: $.
    - name: openxml-add-paragraph
      description: Add a paragraph to a document server-side.
      hints:
        readOnly: false
      call: open-xml-sdk.add-paragraph
      with:
        document-id: tools.document-id
        text: tools.text
        styleId: tools.styleId
      outputParameters:
      - type: object
        mapping: $.
