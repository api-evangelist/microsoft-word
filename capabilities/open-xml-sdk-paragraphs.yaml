naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word Open XML SDK — Paragraphs
  description: 'Microsoft Word Open XML SDK — Paragraphs. 2 operations. Lead operation: Microsoft Word List Document Paragraphs.
    Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Paragraphs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-xml-sdk-paragraphs
    baseUri: https://localhost:5000/api/v1
    description: Microsoft Word Open XML SDK — Paragraphs business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-paragraphs
      path: /documents/{document-id}/paragraphs
      operations:
      - name: listdocumentparagraphs
        method: GET
        description: Microsoft Word List Document Paragraphs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addparagraph
        method: POST
        description: Microsoft Word Add Paragraph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: open-xml-sdk-paragraphs-rest
    port: 8080
    description: REST adapter for Microsoft Word Open XML SDK — Paragraphs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/paragraphs
      name: documents-document-id-paragraphs
      description: REST surface for documents-document-id-paragraphs.
      operations:
      - method: GET
        name: listdocumentparagraphs
        description: Microsoft Word List Document Paragraphs
        call: open-xml-sdk-paragraphs.listdocumentparagraphs
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addparagraph
        description: Microsoft Word Add Paragraph
        call: open-xml-sdk-paragraphs.addparagraph
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-xml-sdk-paragraphs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word Open XML SDK — Paragraphs. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-word-list-document-paragraphs
      description: Microsoft Word List Document Paragraphs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-xml-sdk-paragraphs.listdocumentparagraphs
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-add-paragraph
      description: Microsoft Word Add Paragraph
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: open-xml-sdk-paragraphs.addparagraph
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
