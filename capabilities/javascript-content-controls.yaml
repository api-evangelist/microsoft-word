naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word JavaScript API — Content Controls
  description: 'Microsoft Word JavaScript API — Content Controls. 2 operations. Lead operation: Microsoft Word List Content
    Controls. Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Content Controls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-content-controls
    baseUri: https://word.officeapps.live.com/api/v1
    description: Microsoft Word JavaScript API — Content Controls business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-contentControls
      path: /documents/{document-id}/contentControls
      operations:
      - name: listcontentcontrols
        method: GET
        description: Microsoft Word List Content Controls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: documents-document-id-contentControls-control-id
      path: /documents/{document-id}/contentControls/{control-id}
      operations:
      - name: getcontentcontrol
        method: GET
        description: Microsoft Word Get Content Control
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: control-id
          in: path
          type: string
          description: The unique identifier of the content control.
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_WORD_API_KEY}}'
  exposes:
  - type: rest
    namespace: javascript-content-controls-rest
    port: 8080
    description: REST adapter for Microsoft Word JavaScript API — Content Controls. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/contentcontrols
      name: documents-document-id-contentcontrols
      description: REST surface for documents-document-id-contentControls.
      operations:
      - method: GET
        name: listcontentcontrols
        description: Microsoft Word List Content Controls
        call: javascript-content-controls.listcontentcontrols
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/contentcontrols/{control-id}
      name: documents-document-id-contentcontrols-control-id
      description: REST surface for documents-document-id-contentControls-control-id.
      operations:
      - method: GET
        name: getcontentcontrol
        description: Microsoft Word Get Content Control
        call: javascript-content-controls.getcontentcontrol
        with:
          control-id: rest.control-id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-content-controls-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word JavaScript API — Content Controls. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-word-list-content-controls
      description: Microsoft Word List Content Controls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-content-controls.listcontentcontrols
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-get-content-control
      description: Microsoft Word Get Content Control
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-content-controls.getcontentcontrol
      with:
        control-id: tools.control-id
      outputParameters:
      - type: object
        mapping: $.
