naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word JavaScript API — Properties
  description: 'Microsoft Word JavaScript API — Properties. 2 operations. Lead operation: Microsoft Word Get Document Properties.
    Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Properties
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-properties
    baseUri: https://word.officeapps.live.com/api/v1
    description: Microsoft Word JavaScript API — Properties business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-properties
      path: /documents/{document-id}/properties
      operations:
      - name: getdocumentproperties
        method: GET
        description: Microsoft Word Get Document Properties
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatedocumentproperties
        method: PATCH
        description: Microsoft Word Update Document Properties
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_WORD_API_KEY}}'
  exposes:
  - type: rest
    namespace: javascript-properties-rest
    port: 8080
    description: REST adapter for Microsoft Word JavaScript API — Properties. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/properties
      name: documents-document-id-properties
      description: REST surface for documents-document-id-properties.
      operations:
      - method: GET
        name: getdocumentproperties
        description: Microsoft Word Get Document Properties
        call: javascript-properties.getdocumentproperties
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatedocumentproperties
        description: Microsoft Word Update Document Properties
        call: javascript-properties.updatedocumentproperties
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-properties-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word JavaScript API — Properties. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: microsoft-word-get-document-properties
      description: Microsoft Word Get Document Properties
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-properties.getdocumentproperties
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-update-document-properties
      description: Microsoft Word Update Document Properties
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: javascript-properties.updatedocumentproperties
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
