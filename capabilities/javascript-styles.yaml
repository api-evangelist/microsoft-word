naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word JavaScript API — Styles
  description: 'Microsoft Word JavaScript API — Styles. 1 operations. Lead operation: Microsoft Word List Styles. Self-contained
    Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Styles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: javascript-styles
    baseUri: https://word.officeapps.live.com/api/v1
    description: Microsoft Word JavaScript API — Styles business capability. Self-contained, no shared references.
    resources:
    - name: documents-document-id-styles
      path: /documents/{document-id}/styles
      operations:
      - name: liststyles
        method: GET
        description: Microsoft Word List Styles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_WORD_API_KEY}}'
  exposes:
  - type: rest
    namespace: javascript-styles-rest
    port: 8080
    description: REST adapter for Microsoft Word JavaScript API — Styles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{document-id}/styles
      name: documents-document-id-styles
      description: REST surface for documents-document-id-styles.
      operations:
      - method: GET
        name: liststyles
        description: Microsoft Word List Styles
        call: javascript-styles.liststyles
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: javascript-styles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word JavaScript API — Styles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-word-list-styles
      description: Microsoft Word List Styles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: javascript-styles.liststyles
      outputParameters:
      - type: object
        mapping: $.
