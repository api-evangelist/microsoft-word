naftiko: 1.0.0-alpha2
info:
  label: Microsoft Word Open XML SDK — Documents
  description: 'Microsoft Word Open XML SDK — Documents. 4 operations. Lead operation: Microsoft Word Create Word Document.
    Self-contained Naftiko capability covering one Microsoft Word business surface.'
  tags:
  - Microsoft Word
  - Documents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_WORD_API_KEY: MICROSOFT_WORD_API_KEY
capability:
  consumes:
  - type: http
    namespace: open-xml-sdk-documents
    baseUri: https://localhost:5000/api/v1
    description: Microsoft Word Open XML SDK — Documents business capability. Self-contained, no shared references.
    resources:
    - name: documents
      path: /documents
      operations:
      - name: createworddocument
        method: POST
        description: Microsoft Word Create Word Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: documents-document-id
      path: /documents/{document-id}
      operations:
      - name: getworddocument
        method: GET
        description: Microsoft Word Get Word Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteworddocument
        method: DELETE
        description: Microsoft Word Delete Word Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: documents-document-id-convert
      path: /documents/{document-id}/convert
      operations:
      - name: convertdocument
        method: POST
        description: Microsoft Word Convert Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: open-xml-sdk-documents-rest
    port: 8080
    description: REST adapter for Microsoft Word Open XML SDK — Documents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents
      name: documents
      description: REST surface for documents.
      operations:
      - method: POST
        name: createworddocument
        description: Microsoft Word Create Word Document
        call: open-xml-sdk-documents.createworddocument
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}
      name: documents-document-id
      description: REST surface for documents-document-id.
      operations:
      - method: GET
        name: getworddocument
        description: Microsoft Word Get Word Document
        call: open-xml-sdk-documents.getworddocument
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteworddocument
        description: Microsoft Word Delete Word Document
        call: open-xml-sdk-documents.deleteworddocument
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/documents/{document-id}/convert
      name: documents-document-id-convert
      description: REST surface for documents-document-id-convert.
      operations:
      - method: POST
        name: convertdocument
        description: Microsoft Word Convert Document
        call: open-xml-sdk-documents.convertdocument
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: open-xml-sdk-documents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Word Open XML SDK — Documents. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-word-create-word-document
      description: Microsoft Word Create Word Document
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: open-xml-sdk-documents.createworddocument
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-get-word-document
      description: Microsoft Word Get Word Document
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: open-xml-sdk-documents.getworddocument
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-delete-word-document
      description: Microsoft Word Delete Word Document
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: open-xml-sdk-documents.deleteworddocument
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-word-convert-document
      description: Microsoft Word Convert Document
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: open-xml-sdk-documents.convertdocument
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
