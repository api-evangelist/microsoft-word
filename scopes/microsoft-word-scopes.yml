notes: >-
  Microsoft Graph permissions (scopes) for the Word document surface are the Files.*
  and Sites.* permission families. Each exists as a delegated and an application
  permission; .All variants and Sites.* permissions typically require admin consent.
  Scopes below extend the four declared in the OpenAPI with the additional documented
  file/site permissions that Word-in-OneDrive/SharePoint operations use.
